[project]
name = "template-py-change-me"
version = "0.0.0"
description = "Python uv FastAPI repository template with native validation and CI/CD"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
